name: Build and Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Compute full version ──────────────────────────────────────────
      #   version.py holds MAJOR.MINOR (e.g. "1.0")
      #   PATCH = github.run_number  →  guaranteed unique on every push
      #   Full version = e.g. "1.0.5"
      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          # Read version.py with PowerShell — no subprocess quoting issues
          $content = Get-Content version.py -Raw
          $match   = [regex]::Match($content, '__version__\s*=\s*[''"]([^''"]+)[''"]')
          $base    = $match.Groups[1].Value
          $patch   = "${{ github.run_number }}"
          $full    = "$base.$patch"
          $tag     = "v$full"
          Write-Output "BASE=$base"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "FULL=$full"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "TAG=$tag"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Build version: $full  (tag: $tag)"

      # ── 3. Bake the full version and update index.html ───────────────────
      - name: Update version and index.html
        shell: pwsh
        run: |
          $full    = "${{ steps.ver.outputs.FULL }}"
          $tag     = "${{ steps.ver.outputs.TAG }}"
          
          # Bake into version.py
          $content = Get-Content version.py -Raw
          $content = [regex]::Replace(
            $content,
            '(__version__\s*=\s*[''"])([^''"]+)([''"])',
            "`${1}$full`${3}"
          )
          Set-Content -Path version.py -Value $content -NoNewline
          Write-Host "version.py updated."

          # Update index.html
          $html    = Get-Content index.html -Raw
          $newHref = "https://github.com/Jalpan04/aspisengine/releases/download/$tag/AspisEngine-$tag-windows-x64.zip"
          $html    = [regex]::Replace($html, 'href="https://github.com/Jalpan04/aspisengine/releases/download/[^"]+"', "href=""$newHref""")
          $html    = [regex]::Replace($html, '(<small>)v[0-9.]+( • Windows)', "`${1}$tag`${2}")
          Set-Content -Path index.html -Value $html -NoNewline
          Write-Host "index.html updated."

      # ── 4. Commit and push bumped version and website changes ──────────
      - name: Commit and push changes
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.TAG }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.py index.html
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore: bump version to $tag and update index.html [skip ci]"
            git push origin HEAD:main
            Write-Host "Committed and pushed version bump and website update."
          } else {
            Write-Host "No changes to commit."
          }

      # ── 5. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 6. Cache pip ──────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 7. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pygame pymunk numpy

      # ── 8. Build the exe ─────────────────────────────────────────────────
      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller aspis_onefile.spec --noconfirm

      # ── 9. Zip ───────────────────────────────────────────────────────────
      - name: Package artifact
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.TAG }}"
          Compress-Archive -Path dist\AspisEngine.exe `
                           -DestinationPath "AspisEngine-$tag-windows-x64.zip"
          Write-Host "Created: AspisEngine-$tag-windows-x64.zip"

      # ── 10. Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "Aspis Engine ${{ steps.ver.outputs.TAG }}"
          body: |
            ## Aspis Engine ${{ steps.ver.outputs.TAG }}

            Automated release built from commit [${{ github.sha }}](../../commit/${{ github.sha }}).

            **Branch:** `${{ github.ref_name }}`
            **Build:** #${{ github.run_number }}

            ### Download
            **AspisEngine-${{ steps.ver.outputs.TAG }}-windows-x64.zip**
            Windows 64-bit standalone — no Python installation required.

            ### Changes in this release
            See [commit history](../../commits/${{ github.ref_name }}) for details.
          files: "AspisEngine-${{ steps.ver.outputs.TAG }}-windows-x64.zip"
          draft: false
          prerelease: false
          make_latest: true
